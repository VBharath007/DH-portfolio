<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="40%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" fill="url(#bgGrad)" />
  <rect width="600" height="750" fill="url(#archGrid)" />

  <!-- Outer Architectural Framing Border -->
  <rect x="25" y="25" width="550" height="700" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="8 6" />
  <rect x="35" y="35" width="530" height="680" stroke="#27272a" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 20 50 L 20 20 L 50 20" stroke="#d4d4d8" stroke-width="2.5" fill="none" />
  <path d="M 580 50 L 580 20 L 550 20" stroke="#d4d4d8" stroke-width="2.5" fill="none" />
  <path d="M 20 700 L 20 730 L 50 730" stroke="#d4d4d8" stroke-width="2.5" fill="none" />
  <path d="M 580 700 L 580 730 L 550 730" stroke="#d4d4d8" stroke-width="2.5" fill="none" />

  <!-- Center Executive Silhouette & Crest -->
  <g transform="translate(300, 260)">
    <!-- Aura Ring -->
    <circle cx="0" cy="0" r="140" stroke="#3f3f46" stroke-width="1.5" />
    <circle cx="0" cy="0" r="155" stroke="#27272a" stroke-width="1" stroke-dasharray="4 4" />
    
    <!-- Stylized Executive Silhouette -->
    <!-- Head -->
    <circle cx="0" cy="-35" r="50" fill="#27272a" stroke="#52525b" stroke-width="2" />
    <!-- Shoulders & Suit Lapels -->
    <path d="M -90 90 C -85 30 -50 15 0 15 C 50 15 85 30 90 90 Z" fill="#18181b" stroke="#52525b" stroke-width="2" />
    <!-- Tie and Collar -->
    <path d="M -20 15 L 0 50 L 20 15 Z" fill="#27272a" stroke="#71717a" stroke-width="1.5" />
    <path d="M -7 50 L 0 85 L 7 50 Z" fill="#d4d4d8" />

    <!-- Monogram Shield Center -->
    <rect x="-35" y="-50" width="70" height="30" rx="4" fill="#09090b" stroke="#a1a1aa" stroke-width="1" />
    <text x="0" y="-30" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="700" fill="#fafafa" text-anchor="middle" letter-spacing="2">
      DS
    </text>
  </g>

  <!-- Typography Details -->
  <g transform="translate(300, 480)">
    <text x="0" y="0" font-family="'Cinzel', Georgia, serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">
      ER. DHANAMURUGAN SELVARAJ
    </text>
    <text x="0" y="28" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="4">
      FOUNDER &amp; CHIEF EXECUTIVE OFFICER
    </text>
    <line x1="-100" y1="46" x2="100" y2="46" stroke="#52525b" stroke-width="1" />
    <text x="0" y="66" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#71717a" text-anchor="middle" letter-spacing="2">
      DHANAM HOLDING GROUP
    </text>

    <!-- Placeholder Status Pill -->
    <rect x="-140" y="110" width="280" height="36" rx="18" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <circle cx="-110" cy="128" r="4" fill="#10b981" />
    <text x="10" y="133" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#d4d4d8" text-anchor="middle" letter-spacing="1">
      OFFICIAL PORTRAIT PLACEHOLDER
    </text>
    <text x="0" y="170" font-family="'Inter', sans-serif" font-size="10" font-weight="400" fill="#52525b" text-anchor="middle">
      (Easily replaced via /public/images/ceo/ceo-portrait.svg)
    </text>
  </g>

  <!-- Technical Axis Markers -->
  <text x="45" y="715" font-family="'Courier New', monospace" font-size="10" fill="#52525b">SCALE 1:1 • STRUCTURAL GRADE-A</text>
  <text x="555" y="715" font-family="'Courier New', monospace" font-size="10" fill="#52525b" text-anchor="end">REF: DH-CEO-2026</text>
</svg>
